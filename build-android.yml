      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        working-directory: android
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify and rename APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" Xiangqi_AI_Lab_V11_Android.apk
          ls -lh Xiangqi_AI_Lab_V11_Android.apk
          sha256sum Xiangqi_AI_Lab_V11_Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xiangqi-AI-Lab-V11-Android-APK
          path: Xiangqi_AI_Lab_V11_Android.apk
          if-no-files-found: error
          compression-level: 6
