      - name: Select Xcode
        shell: bash
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        shell: bash
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        shell: bash
        run: xcodegen generate

      - name: Build iPhone and iPad app without signing
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project XiangqiAILabV11.xcodeproj \
            -scheme XiangqiAILabV11 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          test -d "$APP"
          rm -rf Payload Xiangqi_AI_Lab_V11_iOS_unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Xiangqi_AI_Lab_V11_iOS_unsigned.ipa Payload
          test -f Xiangqi_AI_Lab_V11_iOS_unsigned.ipa
          ls -lh Xiangqi_AI_Lab_V11_iOS_unsigned.ipa
          shasum -a 256 Xiangqi_AI_Lab_V11_iOS_unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Xiangqi-AI-Lab-V11-iOS-unsigned-IPA
          path: ios/Xiangqi_AI_Lab_V11_iOS_unsigned.ipa
          if-no-files-found: error
          compression-level: 6
