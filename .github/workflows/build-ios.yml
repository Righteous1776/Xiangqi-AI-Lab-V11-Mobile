      - name: Xcode environment
        shell: bash
        run: |
          xcodebuild -version
          swift --version
          /usr/bin/codesign --version

      - name: Install XcodeGen
        shell: bash
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        shell: bash
        run: xcodegen generate

      - name: Build device app without developer signing
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project XiangqiAILabV11.xcodeproj \
            -scheme XiangqiAILabV11 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Canonical Apple ad-hoc sign for re-signing compatibility
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          test -d "$APP"

          # V5.1 uses the classic AppDelegate window lifecycle. Ensure no stale/generated scene manifest survives.
          /usr/libexec/PlistBuddy -c 'Delete :UIApplicationSceneManifest' "$APP/Info.plist" 2>/dev/null || true

          # Xcode may flatten resource groups. Keep both lookup paths so WKWebView can always find the UI.
          if [ -f "$APP/index.html" ]; then
            mkdir -p "$APP/Resources"
            cp -f "$APP/index.html" "$APP/Resources/index.html"
          elif [ -f "$APP/Resources/index.html" ]; then
            cp -f "$APP/Resources/index.html" "$APP/index.html"
          else
            echo 'ERROR: index.html missing from built app bundle.' >&2
            exit 1
          fi

          # Important: use Apple's codesign, NOT a hand-made LC_CODE_SIGNATURE slot.
          # This generates the Mach-O CodeDirectory and _CodeSignature/CodeResources together.
          /usr/bin/codesign --force --sign - --deep --timestamp=none "$APP"

          # Hard gate: do not upload an IPA unless Apple's own verifier accepts the source bundle.
          /usr/bin/codesign --verify --deep --strict --verbose=4 "$APP"
          /usr/bin/codesign -d --verbose=4 "$APP" 2>&1 | tee build/v5_1-codesign-info.txt
          test -f "$APP/_CodeSignature/CodeResources"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | tee build/v5_1-bundle-id.txt
          find "$APP" -maxdepth 2 -type f -print | sort | tee build/v5_1-app-files.txt

      - name: Package re-sign-ready IPA
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          rm -rf Payload Xiangqi_AI_Lab_V11_iOS_V5_1_ResignReady_AdHoc.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Xiangqi_AI_Lab_V11_iOS_V5_1_ResignReady_AdHoc.ipa Payload
          unzip -t Xiangqi_AI_Lab_V11_iOS_V5_1_ResignReady_AdHoc.ipa >/dev/null
          ls -lh Xiangqi_AI_Lab_V11_iOS_V5_1_ResignReady_AdHoc.ipa
          shasum -a 256 Xiangqi_AI_Lab_V11_iOS_V5_1_ResignReady_AdHoc.ipa

      - name: Upload V5.1 IPA and signing diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Xiangqi-AI-Lab-V11-iOS-V5.1-ResignReady
          path: |
            ios/Xiangqi_AI_Lab_V11_iOS_V5_1_ResignReady_AdHoc.ipa
            ios/build/v5_1-codesign-info.txt
            ios/build/v5_1-bundle-id.txt
            ios/build/v5_1-app-files.txt
          if-no-files-found: error
          compression-level: 6
